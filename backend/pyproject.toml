[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wpsec"
version = "0.1.0"
description = "WordPress Security Audit & Pentest Management platform (backend + workers + CLI)"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "cryptography>=42.0",
  "pyotp>=2.9",
  "redis>=5.0",
  "httpx>=0.27",
  "minio>=7.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "fakeredis>=2.23",
  "ruff>=0.5",
]
# PDF reports are optional; weasyprint needs system libraries (pango/cairo).
# HTML/JSON/CSV/Markdown reports work without it.
pdf = ["weasyprint>=62.0"]

[project.scripts]
wpsec = "app.cli.wpsec:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function-call defaults (Depends/Query) by design
